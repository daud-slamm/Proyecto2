<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Registro | Empieza en el Gym</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <span class="logo-dot"></span> Empieza en el Gym
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="primer-dia.html">Primer día</a></li>
          <li class="nav-item"><a class="nav-link" href="errores.html">Errores típicos</a></li>
          <li class="nav-item"><a class="nav-link" href="mitos.html">Mitos</a></li>
          <li class="nav-item"><a class="nav-link" href="ejercicios.html">Ejercicios</a></li>
          <li class="nav-item"><a class="nav-link" href="test.html">Test</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link" href="login.html">Login</a></li>
          <li class="nav-item"><a class="nav-link active" href="register.html">Registro</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO REGISTRO -->
  <main class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container" style="max-width: 420px; margin-top: -40px;">
      <section class="contact-card">
        <div class="text-center mb-4">
          <span class="badge bg-success-subtle text-success-emphasis mb-2">Crea tu cuenta</span>
          <h1 class="h4 fw-bold mb-1">Regístrate gratis</h1>
        </div>

        <form id="registerForm" onsubmit="event.preventDefault(); procesarRegistro();">
          <div class="mb-3">
            <label class="form-label">Nombre completo</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent text-secondary"><i class="bi bi-person"></i></span>
              <input type="text" class="form-control" id="regNombre" placeholder="Juan Pérez García" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent text-secondary"><i class="bi bi-envelope"></i></span>
              <input type="email" class="form-control" id="regEmail" placeholder="tucorreo@example.com" required>
            </div>
          </div>

          <div class="row">
            <div class="col-6">
              <div class="mb-3">
                <label class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="regPass" placeholder="Mínimo 6" minlength="6" required>
              </div>
            </div>
            <div class="col-6">
              <div class="mb-3">
                <label class="form-label">Repetir</label>
                <input type="password" class="form-control" id="regPassConfirm" placeholder="Repite" required>
              </div>
            </div>
          </div>

          <button type="submit" class="btn btn-success w-100 mb-3">
            <i class="bi bi-person-plus"></i> Crear cuenta
          </button>

          <p class="text-center text-secondary small mb-0">
            ¿Ya tienes cuenta? <a href="login.html" class="text-success text-decoration-none">Inicia sesión</a>
          </p>
        </form>
      </section>
    </div>
  </main>

  <!-- SCRIPT LOGICA REGISTRO -->
  <script>
    function procesarRegistro() {
      const nombre = document.getElementById('regNombre').value;
      const email = document.getElementById('regEmail').value;
      const pass = document.getElementById('regPass').value;
      const passConfirm = document.getElementById('regPassConfirm').value;

      // Validar contraseñas iguales
      if (pass !== passConfirm) {
        alert('Las contraseñas no coinciden');
        return;
      }

      // Obtener usuarios previos o array vacío
      let usuarios = JSON.parse(localStorage.getItem('gymUsers')) || [];

      // Validar que el email no exista ya
      if (usuarios.find(u => u.email === email)) {
        alert('Este correo ya está registrado');
        return;
      }

      // Guardar nuevo usuario
      usuarios.push({ nombre, email, password: pass });
      localStorage.setItem('gymUsers', JSON.stringify(usuarios));
      
      alert('¡Cuenta creada correctamente! Ahora puedes iniciar sesión.');
      window.location.href = 'login.html'; // redirigir al login
    }
  </script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
  // Ejecutar cuando cargue la página
  document.addEventListener("DOMContentLoaded", function() {
    // Comprobar si hay un usuario logueado
    const isLogged = localStorage.getItem('isLogged') === 'true';
    const currentUser = JSON.parse(localStorage.getItem('gymCurrentUser'));
    
    if (isLogged && currentUser) {
      // 1. Ocultar los enlaces de Login y Registro en el menú
      const loginLink = document.querySelector('a[href="login.html"]');
      const registerLink = document.querySelector('a[href="register.html"]');
      if (loginLink) loginLink.parentElement.style.display = 'none';
      if (registerLink) registerLink.parentElement.style.display = 'none';
      
      // 2. Añadir botón de perfil y cerrar sesión
      const menu = document.querySelector('.navbar-nav');
      
      // Crear el nombre del usuario
      const userItem = document.createElement('li');
      userItem.className = 'nav-item d-flex align-items-center ms-lg-3';
      userItem.innerHTML = `
        <span class="text-success fw-bold me-3">
          <i class="bi bi-person-circle"></i> Hola, ${currentUser.nombre}
        </span>
      `;
      
      // Crear el botón de cerrar sesión
      const logoutItem = document.createElement('li');
      logoutItem.className = 'nav-item';
      logoutItem.innerHTML = `
        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm mt-2 mt-lg-0">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      `;
      
      menu.appendChild(userItem);
      menu.appendChild(logoutItem);
    }
  });

  // Función para cerrar sesión
  function cerrarSesion() {
    localStorage.removeItem('isLogged');
    localStorage.removeItem('gymCurrentUser');
    alert('Has cerrado sesión correctamente.');
    window.location.reload(); // Recarga la página para restaurar el menú
  }
</script>

</body>
</html>
