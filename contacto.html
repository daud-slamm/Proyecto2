  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <span class="logo-dot"></span> Empieza en el Gym
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="primer-dia.html">Primer día</a></li>
          <li class="nav-item"><a class="nav-link" href="errores.html">Errores típicos</a></li>
          <li class="nav-item"><a class="nav-link" href="mitos.html">Mitos</a></li>
          <li class="nav-item"><a class="nav-link" href="ejercicios.html">Ejercicios</a></li>
          <li class="nav-item"><a class="nav-link" href="test.html">Test</a></li>
          <li class="nav-item"><a class="nav-link active" href="contacto.html">Contacto</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">Registro</a></li>

        </ul>
      </div>
    </div>
  </nav>

  <main class="page-content container py-5">
    <header class="page-header">
      <span class="badge bg-secondary-subtle text-secondary-emphasis mb-2">Dudas y sugerencias</span>
      <h1 class="h2 fw-bold">Contacto</h1>
      <p>¿Tienes alguna duda o quieres proponer una mejora para la web? Escríbelo aquí.</p>
    </header>

    <section class="contact-card">
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label class="form-label">Nombre</label>
            <input type="text" class="form-control" placeholder="Tu nombre">
          </div>
          <div class="col-md-6">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" placeholder="tucorreo@example.com">
          </div>
          <div class="col-12">
            <label class="form-label">Asunto</label>
            <input type="text" class="form-control" placeholder="Ej: Duda sobre la rutina inicial">
          </div>
          <div class="col-12">
            <label class="form-label">Mensaje</label>
            <textarea class="form-control" rows="4"
                      placeholder="Cuéntanos en qué podemos ayudarte"></textarea>
          </div>
          <div class="col-12 text-end">
            <button type="submit" class="btn btn-success">
              <i class="bi bi-send"></i> Enviar mensaje
            </button>
          </div>
        </div>
      </form>
    </section>
  </main>

  <footer class="main-footer">
    <div class="container text-center">
      <small>© 2026 Empieza en el Gym</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
