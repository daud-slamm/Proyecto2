<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Iniciar sesión | Empieza en el Gym</title>

  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR (igual que en las otras páginas, añade Login si quieres) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">
        <span class="logo-dot"></span> Empieza en el Gym
      </a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="primer-dia.html">Primer día</a></li>
          <li class="nav-item"><a class="nav-link" href="errores.html">Errores típicos</a></li>
          <li class="nav-item"><a class="nav-link" href="mitos.html">Mitos</a></li>
          <li class="nav-item"><a class="nav-link" href="ejercicios.html">Ejercicios</a></li>
          <li class="nav-item"><a class="nav-link" href="test.html">Test</a></li>
          <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
          <li class="nav-item"><a class="nav-link active" href="login.html">Login</a></li>
                    <li class="nav-item"><a class="nav-link active" href="register.html">Registro</a></li>

        </ul>
      </div>
    </div>
  </nav>

  <!-- CONTENIDO LOGIN -->
  <main class="d-flex align-items-center justify-content-center" style="min-height: 100vh;">
    <div class="container" style="max-width: 420px; margin-top: -40px;">
      <section class="contact-card">
        <div class="text-center mb-4">
          <span class="badge bg-success-subtle text-success-emphasis mb-2">
            Área privada
          </span>
          <h1 class="h4 fw-bold mb-1">Inicia sesión</h1>
          <p class="text-secondary mb-0">
            Accede a tu espacio para guardar rutinas y progreso.
          </p>
        </div>

        <form action="#" method="post">
          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent text-secondary">
                <i class="bi bi-envelope"></i>
              </span>
              <input type="email" class="form-control" name="email"
                     placeholder="tucorreo@example.com" required>
            </div>
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <div class="input-group">
              <span class="input-group-text bg-transparent text-secondary">
                <i class="bi bi-lock"></i>
              </span>
              <input type="password" class="form-control" name="password"
                     placeholder="Tu contraseña" required>
            </div>
          </div>

          <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="recordarme">
              <label class="form-check-label" for="recordarme">
                Recuérdame
              </label>
            </div>
            <a href="#" class="small text-decoration-none text-secondary">
              ¿Has olvidado la contraseña?
            </a>
          </div>

          <button type="submit" class="btn btn-success w-100 mb-3">
            <i class="bi bi-box-arrow-in-right"></i> Entrar
          </button>

          <p class="text-center text-secondary small mb-0">
            ¿Aún no tienes cuenta?
            <a href="#" class="text-success text-decoration-none">Regístrate</a>
          </p>
        </form>
      </section>
    </div>
  </main>

  <footer class="main-footer">
    <div class="container text-center">
      <small>© 2026 Empieza en el Gym</small>
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
