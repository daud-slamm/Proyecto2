<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Empieza en el Gym</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- NAVBAR (automáticamente se cambia por JS) -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top shadow-sm">
    <!-- Se modifica dinámicamente -->
  </nav>

  <main class="page-content container py-5">
    <header class="page-header mb-5">
      <div class="d-flex align-items-center">
        <div class="avatar-circle bg-success-subtle text-success me-3">
          <i class="bi bi-person-circle fs-1"></i>
        </div>
        <div>
          <h1 class="h3 mb-0" id="userName">Cargando...</h1>
          <p class="text-secondary mb-0" id="userEmail">Cargando...</p>
        </div>
      </div>
    </header>

    <div class="row g-4">
      <div class="col-md-6">
        <section class="content-card h-100">
          <h2 class="h5 mb-3"><i class="bi bi-calendar-check"></i> Rutinas guardadas</h2>
          <p class="text-muted">Aún no has guardado rutinas.</p>
          <a href="ejercicios.html" class="btn btn-success">
            <i class="bi bi-plus-circle"></i> Guardar rutina
          </a>
        </section>
      </div>

      <div class="col-md-6">
        <section class="content-card h-100">
          <h2 class="h5 mb-3"><i class="bi bi-graph-up"></i> Progreso</h2>
          <div class="progress mb-2" style="height:8px;">
            <div class="progress-bar bg-success" style="width:25%"></div>
          </div>
          <small class="text-muted">25% completado</small>
        </section>
      </div>
    </div>
  </main>

  <footer class="main-footer">
    <div class="container text-center">
      <small>© 2026 Empieza en el Gym</small>
    </div>
  </footer>

  <!-- JS AUTENTICACIÓN -->
  <script src="js/auth.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const user = AuthManager.currentUser();
      if (!user) {
        window.location.href = 'login.html';
        return;
      }
      
      document.getElementById('userName').textContent = user.nombre;
      document.getElementById('userEmail').textContent = user.email;
    });
  </script>
<script>
  // Ejecutar cuando cargue la página
  document.addEventListener("DOMContentLoaded", function() {
    // Comprobar si hay un usuario logueado
    const isLogged = localStorage.getItem('isLogged') === 'true';
    const currentUser = JSON.parse(localStorage.getItem('gymCurrentUser'));
    
    if (isLogged && currentUser) {
      // 1. Ocultar los enlaces de Login y Registro en el menú
      const loginLink = document.querySelector('a[href="login.html"]');
      const registerLink = document.querySelector('a[href="register.html"]');
      if (loginLink) loginLink.parentElement.style.display = 'none';
      if (registerLink) registerLink.parentElement.style.display = 'none';
      
      // 2. Añadir botón de perfil y cerrar sesión
      const menu = document.querySelector('.navbar-nav');
      
      // Crear el nombre del usuario
      const userItem = document.createElement('li');
      userItem.className = 'nav-item d-flex align-items-center ms-lg-3';
      userItem.innerHTML = `
        <span class="text-success fw-bold me-3">
          <i class="bi bi-person-circle"></i> Hola, ${currentUser.nombre}
        </span>
      `;
      
      // Crear el botón de cerrar sesión
      const logoutItem = document.createElement('li');
      logoutItem.className = 'nav-item';
      logoutItem.innerHTML = `
        <button onclick="cerrarSesion()" class="btn btn-outline-danger btn-sm mt-2 mt-lg-0">
          <i class="bi bi-box-arrow-right"></i> Salir
        </button>
      `;
      
      menu.appendChild(userItem);
      menu.appendChild(logoutItem);
    }
  });

  // Función para cerrar sesión
  function cerrarSesion() {
    localStorage.removeItem('isLogged');
    localStorage.removeItem('gymCurrentUser');
    alert('Has cerrado sesión correctamente.');
    window.location.reload(); // Recarga la página para restaurar el menú
  }
</script>

</body>
</html>
