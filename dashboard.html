<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Dashboard | Empieza en el Gym</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
  
  <style>
/* ════════════════════════════════════════════════════════
   EMPIEZA EN EL GYM — LIGHT THEME
   Sora + DM Mono | Green emerald palette
   ════════════════════════════════════════════════════════ */

@import url('https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&family=DM+Mono:wght@400;500&display=swap');

:root {
  --white:#ffffff; --off-white:#f7f8fa; --cream:#f0f2f5;
  --gray-100:#e8ebf0; --gray-200:#d1d5de; --gray-400:#9098a9;
  --gray-600:#5a6278; --gray-800:#2d3142; --gray-900:#1a1d2e;
  --green-500:#10b981; --green-600:#059669; --green-400:#34d399;
  --green-50:#ecfdf5; --green-100:#d1fae5;
  --coral-500:#f97066; --coral-50:#fef2f2;
  --amber-500:#f59e0b; --amber-50:#fffbeb;
  --blue-500:#3b82f6; --blue-50:#eff6ff;
  --purple-500:#8b5cf6; --purple-50:#f5f3ff;
  --teal-500:#14b8a6; --teal-50:#f0fdfa;
  --shadow-sm:0 1px 3px rgba(15,17,26,0.06);
  --shadow-md:0 4px 16px rgba(15,17,26,0.08);
  --shadow-lg:0 12px 40px rgba(15,17,26,0.1);
  --shadow-xl:0 24px 64px rgba(15,17,26,0.12);
  --shadow-green:0 8px 32px rgba(16,185,129,0.25);
  --radius-xl:28px; --radius-lg:20px; --radius-md:14px; --radius-sm:10px;
  --font-display:'Sora',sans-serif; --font-mono:'DM Mono',monospace;
}

*, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
html { scroll-behavior:smooth; }
body {
  font-family:var(--font-display);
  background:var(--off-white);
  color:var(--gray-800);
  overflow-x:hidden;
  min-height:100vh;
  -webkit-font-smoothing:antialiased;
  padding-top:0;
}
::selection { background:var(--green-100); color:var(--green-600); }
::-webkit-scrollbar { width:7px; }
::-webkit-scrollbar-track { background:var(--off-white); }
::-webkit-scrollbar-thumb { background:var(--gray-200); border-radius:99px; }
::-webkit-scrollbar-thumb:hover { background:var(--green-500); }
a { color:inherit; text-decoration:none; }
img { max-width:100%; display:block; }

/* Grid texture */
body::before {
  content:''; position:fixed; inset:0;
  background-image:
    linear-gradient(rgba(0,0,0,0.02) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,0,0,0.02) 1px, transparent 1px);
  background-size:60px 60px;
  pointer-events:none; z-index:0;
}

/* ── NAVBAR ── */
.navbar {
  position:fixed; top:0; left:0; right:0; z-index:1000;
  padding:16px 0;
  transition:all .35s cubic-bezier(.4,0,.2,1);
  background:transparent;
}
.navbar.scrolled {
  background:rgba(247,248,250,0.92);
  backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px);
  border-bottom:1px solid var(--gray-100);
  padding:10px 0;
  box-shadow:var(--shadow-sm);
}
.navbar-inner {
  max-width:1180px; margin:0 auto; padding:0 24px;
  display:flex; align-items:center; justify-content:space-between;
}
.nav-logo {
  display:flex; align-items:center; gap:10px;
  font-weight:800; font-size:1.1rem;
  letter-spacing:-0.04em; color:var(--gray-900);
}
.nav-logo .dot {
  width:11px; height:11px; border-radius:50%;
  background:var(--green-500);
  box-shadow:0 0 0 3px rgba(16,185,129,0.2);
  animation:breathe 3s ease-in-out infinite;
}
@keyframes breathe {
  0%,100% { box-shadow:0 0 0 3px rgba(16,185,129,0.2); }
  50% { box-shadow:0 0 0 8px rgba(16,185,129,0.1), 0 0 20px rgba(16,185,129,0.15); }
}
.nav-links {
  display:flex; align-items:center; gap:2px; list-style:none;
}
.nav-links a {
  font-size:.84rem; font-weight:500; color:var(--gray-600);
  padding:8px 14px; border-radius:var(--radius-sm);
  transition:all .2s ease;
}
.nav-links a:hover { color:var(--gray-900); background:var(--cream); }
.nav-links a.active { color:var(--green-600); background:var(--green-50); }
.nav-cta {
  background:var(--green-500)!important; color:var(--white)!important;
  font-weight:600!important; margin-left:8px; padding:8px 18px!important;
  box-shadow:var(--shadow-green); border-radius:var(--radius-sm)!important;
  transition:all .25s ease!important;
}
.nav-cta:hover {
  background:var(--green-600)!important; transform:translateY(-1px);
  box-shadow:0 10px 36px rgba(16,185,129,0.3)!important;
}
.nav-toggle {
  display:none; background:var(--cream); border:1px solid var(--gray-100);
  color:var(--gray-800); font-size:1.3rem; cursor:pointer;
  padding:6px 10px; border-radius:var(--radius-sm); transition:all .2s;
}
.nav-toggle:hover { background:var(--gray-100); }

/* ── PAGE HERO ── */
.page-hero {
  padding:130px 24px 60px; text-align:center;
  position:relative; z-index:1; overflow:hidden;
}
.page-hero .hero-blob {
  position:absolute; border-radius:50%; filter:blur(90px);
  pointer-events:none; opacity:.5;
}
.page-hero-inner {
  max-width:640px; margin:0 auto; position:relative; z-index:2;
}
.page-hero .hero-tag {
  display:inline-flex; align-items:center; gap:8px;
  padding:6px 16px; border-radius:999px;
  font-size:.73rem; font-weight:700;
  letter-spacing:.1em; text-transform:uppercase;
  margin-bottom:20px;
}
.page-hero h1 {
  font-size:clamp(2rem,4.5vw,3rem); font-weight:800;
  letter-spacing:-0.04em; color:var(--gray-900);
  margin-bottom:14px; line-height:1.08;
}
.page-hero p {
  font-size:1rem; color:var(--gray-600);
  line-height:1.7; max-width:520px; margin:0 auto;
}

/* ── SECTION HEADER ── */
.section-header { text-align:center; max-width:560px; margin:0 auto 56px; }
.section-tag {
  display:inline-flex; align-items:center; gap:8px;
  font-size:.72rem; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:var(--green-600);
  font-family:var(--font-mono); margin-bottom:14px;
  background:var(--green-50); padding:5px 14px;
  border-radius:999px; border:1px solid var(--green-100);
}
.section-title {
  font-size:clamp(1.8rem,3.5vw,2.6rem); font-weight:800;
  letter-spacing:-0.04em; color:var(--gray-900);
  margin-bottom:14px; line-height:1.1;
}
.section-desc { font-size:1rem; color:var(--gray-600); line-height:1.7; }

/* ── BUTTONS ── */
.btn-primary-custom {
  display:inline-flex; align-items:center; gap:8px;
  padding:14px 28px; border-radius:var(--radius-md);
  font-family:var(--font-display); font-weight:700; font-size:.92rem;
  border:none; cursor:pointer;
  transition:all .3s cubic-bezier(.4,0,.2,1);
  background:var(--green-500); color:var(--white);
  box-shadow:var(--shadow-green);
}
.btn-primary-custom:hover {
  background:var(--green-600); transform:translateY(-3px);
  box-shadow:0 12px 40px rgba(16,185,129,0.35);
}
.btn-secondary-custom {
  display:inline-flex; align-items:center; gap:8px;
  padding:14px 28px; border-radius:var(--radius-md);
  font-family:var(--font-display); font-weight:600; font-size:.92rem;
  cursor:pointer; transition:all .3s ease;
  background:var(--white); color:var(--gray-800);
  border:1px solid var(--gray-200); box-shadow:var(--shadow-sm);
}
.btn-secondary-custom:hover {
  background:var(--cream); border-color:var(--gray-400);
  transform:translateY(-2px); box-shadow:var(--shadow-md);
}

/* ── TIP BOX ── */
.tip-box {
  max-width:640px; margin:48px auto 0;
  background:var(--green-50); border:1px solid var(--green-100);
  border-radius:var(--radius-lg); padding:24px 28px;
  display:flex; align-items:flex-start; gap:14px;
}
.tip-box i { font-size:1.4rem; color:var(--green-500); flex-shrink:0; margin-top:2px; }
.tip-box p { font-size:.9rem; color:var(--gray-600); line-height:1.65; margin:0; }
.tip-box strong { color:var(--gray-900); }

/* ── FORMS ── */
.form-card {
  background:var(--white); border:1px solid var(--gray-100);
  border-radius:var(--radius-xl); padding:36px;
  box-shadow:var(--shadow-lg);
}
.form-label {
  font-size:.84rem; font-weight:600;
  color:var(--gray-800); margin-bottom:6px; display:block;
}
.form-input {
  width:100%; padding:12px 16px;
  border:1px solid var(--gray-200); border-radius:var(--radius-sm);
  font-family:var(--font-display); font-size:.9rem;
  color:var(--gray-900); background:var(--off-white);
  transition:all .2s ease; outline:none;
}
.form-input:focus {
  border-color:var(--green-500);
  box-shadow:0 0 0 3px rgba(16,185,129,0.12);
  background:var(--white);
}
.form-input::placeholder { color:var(--gray-400); }
textarea.form-input { resize:vertical; min-height:100px; }
.input-group { display:flex; align-items:stretch; }
.input-group .input-icon {
  display:flex; align-items:center; justify-content:center;
  padding:0 14px; background:var(--cream);
  border:1px solid var(--gray-200); border-right:none;
  border-radius:var(--radius-sm) 0 0 var(--radius-sm);
  color:var(--gray-400); font-size:1rem;
}
.input-group .form-input { border-radius:0 var(--radius-sm) var(--radius-sm) 0; }
.btn-submit {
  width:100%; padding:14px; border-radius:var(--radius-md);
  font-family:var(--font-display); font-weight:700; font-size:.92rem;
  border:none; cursor:pointer;
  background:var(--green-500); color:var(--white);
  box-shadow:var(--shadow-green); transition:all .25s ease;
}
.btn-submit:hover {
  background:var(--green-600); transform:translateY(-2px);
  box-shadow:0 10px 36px rgba(16,185,129,0.3);
}

/* ── FOOTER ── */
.footer {
  position:relative; z-index:1;
  border-top:1px solid var(--gray-100);
  padding:36px 24px; background:var(--white);
}
.footer-inner {
  max-width:1180px; margin:0 auto;
  display:flex; justify-content:space-between;
  align-items:center; flex-wrap:wrap; gap:16px;
}
.footer small { color:var(--gray-400); font-size:.82rem; }
.footer-links { display:flex; gap:24px; }
.footer-links a {
  font-size:.82rem; color:var(--gray-400);
  font-weight:500; transition:color .2s;
}
.footer-links a:hover { color:var(--green-500); }

/* ── SCROLL REVEAL ── */
.reveal {
  opacity:0; transform:translateY(28px);
  transition:all .65s cubic-bezier(.22,1,.36,1);
}
.reveal.visible { opacity:1; transform:translateY(0); }
.reveal-d1 { transition-delay:.08s; }
.reveal-d2 { transition-delay:.16s; }
.reveal-d3 { transition-delay:.24s; }
.reveal-d4 { transition-delay:.32s; }

/* ── RESPONSIVE ── */
@media (max-width:768px) {
  .nav-links { display:none; }
  .nav-links.open {
    display:flex; flex-direction:column;
    position:absolute; top:100%; left:0; right:0;
    background:rgba(247,248,250,0.97);
    backdrop-filter:blur(20px); padding:16px 24px;
    border-bottom:1px solid var(--gray-100);
    box-shadow:var(--shadow-md); gap:2px;
  }
  .nav-links.open a { padding:12px 16px; }
  .nav-toggle { display:flex; align-items:center; justify-content:center; }
  .page-hero { padding:110px 24px 48px; }
  .tip-box { flex-direction:column; text-align:center; }
  .footer-inner { flex-direction:column; text-align:center; }
}


    .dash-page{position:relative;z-index:1;max-width:900px;margin:0 auto;padding:130px 24px 80px}
    .dash-header{display:flex;align-items:center;gap:18px;margin-bottom:40px}
    .dash-avatar{width:64px;height:64px;border-radius:var(--radius-md);background:var(--green-50);color:var(--green-600);display:flex;align-items:center;justify-content:center;font-size:1.8rem;flex-shrink:0}
    .dash-name{font-size:1.5rem;font-weight:800;color:var(--gray-900)}
    .dash-email{font-size:.88rem;color:var(--gray-400)}
    .dash-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
    .dash-card{background:var(--white);border:1px solid var(--gray-100);border-radius:var(--radius-lg);padding:28px 24px;transition:all .3s ease}
    .dash-card:hover{box-shadow:var(--shadow-lg);border-color:var(--green-100);transform:translateY(-4px)}
    .dash-card h2{font-size:1rem;font-weight:700;color:var(--gray-900);margin-bottom:14px;display:flex;align-items:center;gap:8px}
    .dash-card h2 i{color:var(--green-500)}
    .dash-card p{font-size:.88rem;color:var(--gray-400);margin-bottom:18px}
    .progress-track-dash{height:8px;background:var(--gray-100);border-radius:99px;overflow:hidden;margin-bottom:8px}
    .progress-fill-dash{height:100%;background:var(--green-500);border-radius:99px;width:25%}
    .progress-label-dash{font-size:.78rem;color:var(--gray-400);font-family:var(--font-mono)}
    @media(max-width:768px){.dash-grid{grid-template-columns:1fr}}
  </style>
</head>
<body>
  <nav class="navbar" id="navbar"><div class="navbar-inner"><a href="index.html" class="nav-logo"><span class="dot"></span> Empieza en el Gym</a><button class="nav-toggle" id="navToggle" aria-label="Menú"><i class="bi bi-list"></i></button><ul class="nav-links" id="navLinks"><li><a href="primer-dia.html">Primer día</a></li><li><a href="errores.html">Errores</a></li><li><a href="mitos.html">Mitos</a></li><li><a href="ejercicios.html">Ejercicios</a></li><li><a href="test.html">Test</a></li><li><a href="contacto.html">Contacto</a></li><li><a href="login.html" id="loginLink">Login</a></li><li><a href="register.html" class="nav-cta" id="registerLink"><i class="bi bi-person-plus"></i> Registro</a></li></ul></div></nav>

  <main class="dash-page">
    <div class="dash-header reveal"><div class="dash-avatar"><i class="bi bi-person-circle"></i></div><div><div class="dash-name" id="userName">Cargando...</div><div class="dash-email" id="userEmail">Cargando...</div></div></div>
    <div class="dash-grid">
      <div class="dash-card reveal reveal-d1"><h2><i class="bi bi-calendar-check-fill"></i> Rutinas guardadas</h2><p>Aún no has guardado rutinas.</p><a href="ejercicios.html" class="btn-primary-custom" style="font-size:.85rem;padding:10px 20px"><i class="bi bi-plus-circle"></i> Guardar rutina</a></div>
      <div class="dash-card reveal reveal-d2"><h2><i class="bi bi-graph-up"></i> Progreso</h2><div class="progress-track-dash"><div class="progress-fill-dash"></div></div><div class="progress-label-dash">25% completado</div></div>
    </div>
  </main>

  <footer class="footer"><div class="footer-inner"><small>&copy; 2026 Empieza en el Gym</small><div class="footer-links"><a href="index.html">Inicio</a><a href="ejercicios.html">Ejercicios</a><a href="test.html">Test</a><a href="contacto.html">Contacto</a></div></div></footer>
  
  <script>
    document.addEventListener('DOMContentLoaded',function(){const isLogged=localStorage.getItem('isLogged')==='true';
    let user=null;try{user=JSON.parse(localStorage.getItem('gymCurrentUser'));}catch(e){}
    if(!isLogged||!user){window.location.href='login.html';return;}
    document.getElementById('userName').textContent=user.nombre;document.getElementById('userEmail').textContent=user.email;});
  </script>
<script>
    const navbar=document.getElementById('navbar');if(navbar){window.addEventListener('scroll',()=>{navbar.classList.toggle('scrolled',window.scrollY>30)});if(window.scrollY>30)navbar.classList.add('scrolled')}
    const navToggle=document.getElementById('navToggle'),navLinks=document.getElementById('navLinks');if(navToggle&&navLinks){navToggle.addEventListener('click',()=>{navLinks.classList.toggle('open');const i=navToggle.querySelector('i');i.classList.toggle('bi-list');i.classList.toggle('bi-x-lg')})}
    const reveals=document.querySelectorAll('.reveal');if(reveals.length){const obs=new IntersectionObserver(entries=>{entries.forEach(e=>{if(e.isIntersecting){e.target.classList.add('visible');obs.unobserve(e.target)}})},{threshold:.1});reveals.forEach(el=>obs.observe(el))}
    document.addEventListener('DOMContentLoaded',function(){const isLogged=localStorage.getItem('isLogged')==='true';let cu=null;try{cu=JSON.parse(localStorage.getItem('gymCurrentUser'))}catch(e){}if(isLogged&&cu){const ll=document.getElementById('loginLink'),rl=document.getElementById('registerLink');if(ll)ll.parentElement.style.display='none';if(rl)rl.parentElement.style.display='none';const nl=document.getElementById('navLinks');if(nl){const u=document.createElement('li');u.innerHTML='<span style="color:var(--green-600);font-weight:700;font-size:.84rem;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;"><i class="bi bi-person-circle"></i> '+cu.nombre+'</span>';nl.appendChild(u);const l=document.createElement('li');l.innerHTML='<a href="#" onclick="cerrarSesion();return false;" style="color:#ef4444;font-weight:600;font-size:.84rem;padding:8px 14px;display:inline-flex;align-items:center;gap:6px;"><i class="bi bi-box-arrow-right"></i> Salir</a>';nl.appendChild(l)}}});
    function cerrarSesion(){localStorage.removeItem('isLogged');localStorage.removeItem('gymCurrentUser');window.location.reload()}
</script>
</body>
</html>
